  <!-- NAVBAR -->

    <div class="max-w-7xl mx-auto flex justify-between items-center">

      <a href="https://wa.me/2348166978348" target="_blank" class="bg-black text-white px-4 py-2 rounded-lg">Contact Us</a>

<section id="callback" class="py-20 pt-32 h-screen">
    <div class="max-w-7xl mx-auto text-center">
        <h2 class="text-3xl font-bold mb-4">Congratulations!</h2>
        <p class="text-lg mb-2">Your order has been successfully placed.</p>
        <div class="bg-white shadow-md rounded-lg p-6 inline-block">
            <h3 class="text-xl font-semibold mb-2">Order Details</h3>
            <p><strong>Amount:</strong> <span id="amt"></span></p>
            <p><strong>Transfer Name:</strong> <span id="sender_name"></span></p>
            <p><strong>Account Details:</strong> <span id="account_details"></span></p>
        </div>
        <p class="mt-4">Thank you for choosing Royale Experience Global Concept!</p>
        <div id="confetti"></div>
        <span class="emoji" role="img" aria-label="party">🎉</span>
    </div>
</section>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const ref = urlParams.get('ref');

  if (ref) {
    fetch(`https://payflow.sgm.ng/verifypro/${ref}`)
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          document.getElementById('amt').textContent = `₦${data.data.amount}`;
          document.getElementById('sender_name').textContent = data.data.sender_name;
          document.getElementById('account_details').textContent = `${data.data.sender_account_number} (${data.data.sender_bank})`;
        }
      })
      .catch(error => console.error('Error:', error));
  }
</script>
